name = "latex-editor-cloud"
account_id = "a533b356d5a670c392fdc7dd9969c5c9"
main = "src/index.js"
compatibility_date = "2026-09-23"

[vars]
PUBLIC_BASE_URL = "https://latex-editor-cloud.emsidt.workers.dev"
GOOGLE_CLIENT_ID = "650381311880-d5bcftb7u1djc7raui71bfmqdoam8q07.apps.googleusercontent.com"
ACCOUNT_STORAGE_BYTES = "1073741824"
PROJECT_STORAGE_BYTES = "524288000"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[r2_buckets]]
binding = "PROJECTS"
bucket_name = "latex-editor-projects"

[[d1_databases]]
binding = "DB"
database_name = "latex-editor-db"
database_id = "2ba8fe4b-7487-4b4a-8276-b3551a420150"

[[durable_objects.bindings]]
name = "COLLABORATION_ROOMS"
class_name = "ProjectCollaborationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectCollaborationRoom"]

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PROJECT_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# GOOGLE_CLIENT_SECRET is set with `wrangler secret put`, never in this file.
