<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>LaTeX Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" title="LaTeX Editor">
      <span class="brand-mark">L</span>
      <strong>LaTeX Editor</strong>
    </div>

    <div class="divider"></div>

    <div id="project-tabs" class="project-tabs" aria-label="Các project đang mở"></div>

    <button id="open-project" class="toolbar-button"><span>⌁</span> Mở thư mục</button>
    <button id="new-project" class="toolbar-button primary"><span>＋</span> Project mới</button>

    <div class="spacer"></div>

    <button id="runtime-details" class="runtime-button" title="Xem trạng thái LaTeX runtime">
      <span id="runtime-dot" class="dot checking"></span>
      <span id="runtime-label">Kiểm tra LaTeX…</span>
    </button>
    <div class="status" title="Trạng thái code-server">
      <span id="status-dot" class="dot checking"></span>
      <span id="status-text">Đang kết nối…</span>
    </div>
  </header>

  <main id="empty-workspace" class="empty-workspace" hidden>
    <div class="empty-workspace-card">
      <span class="empty-workspace-mark">L</span>
      <h1>Chưa mở project</h1>
      <p>Mở một thư mục LaTeX có sẵn hoặc tạo project mới để bắt đầu.</p>
    </div>
  </main>

  <dialog id="new-dialog">
    <form method="dialog">
      <h2>Tạo project mới</h2>
      <p>Project được tạo từ template bài báo cơ bản.</p>
      <label for="new-project-name">Tên project</label>
      <input id="new-project-name" maxlength="100" placeholder="Ví dụ: Báo cáo tốt nghiệp" autocomplete="off">
      <div id="dialog-error" class="error" aria-live="polite"></div>
      <div class="dialog-actions">
        <button value="cancel">Hủy</button>
        <button id="create-confirm" value="default" class="primary">Tạo project</button>
      </div>
    </form>
  </dialog>

  <dialog id="runtime-dialog">
    <form method="dialog">
      <h2>LaTeX runtime</h2>
      <div id="runtime-content"></div>
      <div class="dialog-actions"><button value="close" class="primary">Đóng</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
